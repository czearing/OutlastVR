; Paths may be absolute or relative to this file. Restart the game after editing.
[game]
; Leave empty when extracted beside Binaries\Win64\OLGame.exe.
executable=

[vr]
; Empty uses the bundled loader and your system's active OpenXR runtime.
openxr_loader=
; 0 selects smooth turning. Nonzero values select snap turns; range 15..90.
snap_turn_degrees=0
; Fix eye height at the native camera; use button crouch while seated.
seated=false
; Swap action hands and sticks, without swapping the physical hand skeletons.
left_handed=false
; Click to toggle sprint; releasing the movement stick also stops sprinting.
toggle_sprint=false
; game, head, main_hand or off_hand. Lost directional-hand tracking stops movement.
movement_reference=game
; Larger values make the world appear larger; range 0.5..2.
world_scale=1
; Movement-only peripheral dimming; 0 disables, range 0..1.
vignette_strength=0
; Opt into native hit-induced screen distortion. Other damage cues remain enabled.
hit_distortion=false
; Initial values for the live, session-only F10 effects menu.
bloom=true
film_grain=true
; Visual skeletal follow; small head glances leave the body facing unchanged.
body_follow=true
; Start catching up beyond this angle; range 10..90 degrees.
body_follow_deadzone=35
; Maximum item-to-hand distance; range 0.1..0.6 metres. Native reach limits remain.
hand_pickup_radius=0.30

[experimental]
; Opt-in only. Replaces full-view night vision with the held camera.
physical_camcorder=false
; Complete admitted inventory pickups immediately. false retains native animations.
instant_pickups=true
