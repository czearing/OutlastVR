name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/diagnostics/requirements.txt
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $native = Join-Path $env:MSYS2_ROOT 'ucrt64\bin'
          $native | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:Path = "$native;$env:Path"
          python -m pip install -r tools\diagnostics\requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $python = (Get-Command python).Source
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOLVR_BUILD_DIAGNOSTICS=ON "-DPython3_EXECUTABLE=$python"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $version = '0.1.0'
          if ($env:RELEASE_TAG) { $version = $env:RELEASE_TAG -replace '^v','' }
          .\tools\package.ps1 -Version $version
          if (-not $?) { exit 1 }
          python tools\verify_package.py "dist\OutlastVR-$version-win64"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OutlastVR-win64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" -n OutlastVR-win64 -D release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --title "Outlast VR $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 "${args[@]}"
